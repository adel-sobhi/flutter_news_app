name: notes_app
description: A simple Notes app built with Clean Architecture and Cubit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.6.7
  injectable: ^2.4.4
  image_picker: ^1.1.2
  dartz: ^0.10.1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  sqflite: ^2.4.3
  path: ^1.9.1
  flutter_dotenv: ^6.0.1
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  injectable_generator: ^2.6.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SFPRODISPLAYBOLD.OTF
          weight: 700
        - asset: assets/fonts/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/fonts/SFPRODISPLAYREGULAR.OTF
          weight: 400

  assets:
    - .env
